---

ansible-navigator:
  playbook-artifact:
    save-as: "runs/{playbook_name}-{time_stamp}.json"

  ansible-runner:
    artifact-dir: runs
    rotate-artifacts-count: 3

  logging:
    level: debug
    append: false

  ansible:
    inventory:
      entries:
        - inventory.yml

  execution-environment:
    enabled: true
    environment-variables:
      pass:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - AWS_SESSION_TOKEN
        - CDP_LICENSE_FILE
        # ECS topology: uncomment these for CDP CLI access
        # - CDP_PROFILE
        # - CDP_ACCESS_KEY_ID
        # - CDP_PRIVATE_KEY
        # - CDP_ENDPOINT_URL
        # Optional pre-existing SSH key
        # - SSH_PRIVATE_KEY_FILE
      set:
        ANSIBLE_SSH_CONTROL_PATH: "/dev/shm/cp%%h-%%p-%%r"
        ANSIBLE_CALLBACK_WHITELIST: "ansible.posix.profile_tasks"
        ANSIBLE_GATHERING: "smart"
        ANSIBLE_DEPRECATION_WARNINGS: false
        ANSIBLE_HOST_KEY_CHECKING: false
        ANSIBLE_SSH_RETRIES: 10
    # image: ghcr.io/cloudera-labs/cloudera-ce-aws:latest
    image: localhost/cloudera-ce-aws:1.0.0
    pull:
      policy: tag
    volume-mounts:
      - src: "${CDP_LICENSE_FILE}"
        dest: "${CDP_LICENSE_FILE}"
      # ECS topology: uncomment for CDP CLI credentials
      # - src: "~/.cdp"
      #   dest: "/runner/.cdp"
      # Optional pre-existing SSH key
      # - src: "${SSH_PRIVATE_KEY_FILE}"
      #   dest: "${SSH_PRIVATE_KEY_FILE}"
    container-options:
      - "--network=host"
