      register: __smm
      notify: Services updated

    - name: Establish SQL Stream Builder service
      tags:
        - ssb
        - host_template
      cloudera.cluster.service:
        cluster: full-base-cluster
        name: sql_stream_builder
        type: SQL_STREAM_BUILDER
        config:
          flink_service: "{{ __flink.service.name }}"
          kafka_service: "{{ __kafka.service.name }}"
          knox_service: "{{ __knox.service.name }}"
          database_host: "{{ groups['postgresql'] | first }}"
          security.kerberos.enabled: true
        role_config_groups:
          - type: MATERIALIZED_VIEW_ENGINE
            config:
              ssb.mve.datasource.username: ssb_mve
              ssb.mve.datasource.url: "jdbc:postgresql://{{ groups['postgresql'] | first }}:5432/ssb_mve"
          - type: STREAMING_SQL_ENGINE
            config:
              ssb.yarn.ui.proxy: "https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}/gateway/cdp-proxy/yarnuiv2/proxy"
              ssb.mve.proxy: "https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}/gateway/cdp-proxy-api/ssb-mve-api"
      register: __ssb
      notify: Services updated

    - name: Establish NiFi service
      tags:
        - nifi
        - host_template
      cloudera.cluster.service:
        cluster: full-base-cluster
        name: nifi
        type: NIFI
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          knox_service: "{{ __knox.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          atlas_service: "{{ __atlas.service.name }}"
          kerberos.auth.enabled: true
        role_config_groups:
          - type: NIFI_NODE
            config:
              nifi.jdk.home: "/usr/lib/jvm/zulu21"
              nifi.web.https.port: 8445
              nifi.ldap.enabled: true
              nifi.ldap.authentication.strategy: LDAPS
              nifi.ldap.manager.dn: "uid=admin,cn=users,cn=accounts,{{ base_dn }}"
              nifi.ldap.manager.password: "{{ common_password }}"
              nifi.ldap.tls.client.auth: NONE
              nifi.ldap.tls.protocol: TLSv1.2
              nifi.ldap.tls.truststore: /var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks
              nifi.ldap.tls.truststore.password: "{{ truststore_password }}"
              nifi.ldap.tls.truststore.type: JKS
              nifi.ldap.url: "ldaps://{{ groups['freeipa'] | first }}"
              nifi.ldap.user.search.base: "cn=users,cn=accounts,{{ base_dn }}"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Member Attribute: member
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Name Attribute: cn
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Object Class: posixgroup
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Search Base: "cn=groups,cn=accounts,{{ base_dn }}"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Sync Interval: 1 min
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.User Group Name Attribute: memberOf
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.User Identity Attribute: uid
              xml.loginIdentityProviders.provider.ldap-provider.property.Identity Strategy: USE_USERNAME
              xml.loginIdentityProviders.provider.ldap-provider.property.User Search Filter: "uid={0}"
              staging/authorizers.xml_role_safety_valve: "<property><name>xml.authorizers.userGroupProvider.composite-configurable-user-group-provider.property.User Group Provider 2</name><value>ldap-user-group-provider</value></property>"
              nifi.security.identity.mapping.pattern.kerb: "^(.*?)(/.*?)?@(.*?)$"
              nifi.security.identity.mapping.transform.kerb: LOWER
              nifi.security.identity.mapping.value.kerb: "$1"
      register: __nifi
      notify: Services updated

    - name: Establish NiFi Registry service
      tags:
        - nifiregistry
        - host_template
      cloudera.cluster.service:
        cluster: full-base-cluster
        name: nifiregistry
        type: NIFIREGISTRY
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          knox_service: "{{ __knox.service.name }}"
          nifi_service: "{{ __nifi.service.name }}"
          kerberos.auth.enabled: true
        role_config_groups:
          - type: NIFI_REGISTRY_SERVER
            config:
              nifi.registry.jdk.home: "/usr/lib/jvm/zulu21"
              nifi.registry.ldap.enabled: true
              nifi.registry.ldap.authentication.strategy: LDAPS
              nifi.registry.ldap.manager.dn: "uid=admin,cn=users,cn=accounts,{{ base_dn }}"
              nifi.registry.ldap.manager.password: "{{ common_password }}"
              nifi.registry.ldap.tls.client.auth: NONE
              nifi.registry.ldap.tls.protocol: TLSv1.2
              nifi.registry.ldap.tls.truststore: /var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks
              nifi.registry.ldap.tls.truststore.password: "{{ truststore_password }}"
              nifi.registry.ldap.tls.truststore.type: JKS
              nifi.registry.ldap.url: "ldaps://{{ groups['freeipa'] | first }}"
              nifi.registry.ldap.user.search.base: "cn=users,cn=accounts,{{ base_dn }}"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Member Attribute: member
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Name Attribute: cn
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Object Class: posixgroup
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Group Search Base: "cn=groups,cn=accounts,{{ base_dn }}"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.Sync Interval: "1 mins"
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.User Group Name Attribute: memberOf
              xml.authorizers.userGroupProvider.ldap-user-group-provider.property.User Identity Attribute: uid
              xml.identityProviders.provider.ldap-provider.property.Identity Strategy: USE_USERNAME
              xml.identityProviders.provider.ldap-provider.property.User Search Filter: "uid={0}"
              staging/authorizers.xml_role_safety_valve: "<property><name>xml.authorizers.userGroupProvider.composite-configurable-user-group-provider.property.User Group Provider 2</name><value>ldap-user-group-provider</value></property>"
              nifi.registry.security.identity.mapping.pattern.kerb: "^(.*?)(/.*?)?@(.*?)$"
              nifi.registry.security.identity.mapping.transform.kerb: LOWER
              nifi.registry.security.identity.mapping.value.kerb: "$1"
              nifi.registry.security.identity.mapping.transform.dn: LOWER
      register: __nifiregistry
      notify: Services updated

    - name: Establish Hue service
      tags:
        - hue
        - host_template
      cloudera.cluster.service:
        cluster: full-base-cluster
        name: hue
        type: HUE
        skip_redacted: true
        config:
          database_host: "{{ groups['postgresql'] | first }}"
          database_type: postgresql
          database_name: hue
          database_port: 5432
          database_password: "{{ hue_password }}"
