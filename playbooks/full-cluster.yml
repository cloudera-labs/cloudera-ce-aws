            fs_defaultfs=ofs://o3service1
            webhdfs_url=https://{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'SDX') | map(attribute='inventory_hostname') | first }}:9778/webhdfs/v1
            ssl_cert_ca_verify=true
            security_enabled=true

            [[session]]
            csrf_trusted_origins=https://knox.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}
            trusted_origins=knox.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}
