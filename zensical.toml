[project]
site_name = "Cloudera On Premise Community Edition"
site_author = "Cloudera Labs"
copyright = """2026 Cloudera, Inc. All rights reserved.<br><a href="https://www.cloudera.com/legal/terms-and-conditions.html" target="_blank">Terms & Conditions | </a>  <a href="https://www.cloudera.com/legal/policies.html" target="_blank"> Privacy Policy and Data Policy</a>"""
repo_url = "https://github.com/cloudera-labs/cloudera-ce-aws.git"
repo_name = "cloudera-ce-aws"

docs_dir = "docs"
site_dir = "docs/zensical/_build"
use_directory_urls = false
extra_css = ["assets/stylesheets/extra.css"]

nav = [
  { "Home" = "README.md" },
  { "Getting Started" = [
    { "Prerequisites" = "getting-started/README.md" },
    { "Configuration" = "getting-started/configuration.md" },
  ] },
  { "Deployment" = [
    { "Overview" = "deployment/README.md" },
    { "Infrastructure" = "deployment/infrastructure.md" },
    { "Services" = "deployment/services.md" },
    { "Cloudera Manager" = "deployment/cloudera-manager.md" },
    { "Clusters" = "deployment/clusters.md" },
  ] },
  { "Operations" = [
    { "Accessing the Deployment" = "operations/README.md" },
    { "SSH Access" = "operations/ssh.md" },
    { "Tear Down" = "operations/teardown.md" },
  ] },
  { "Reference" = [
    { "Architecture" = "reference/README.md" },
    { "Execution Environment" = "reference/execution-environment.md" },
  ] },
]

[project.theme]
variant = "classic"
custom_dir = "docs/zensical/overrides"
logo = "assets/images/logo-cloudera-white.svg"
favicon = "assets/images/favicon.ico"
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.sections",
  "navigation.footer",
  "navigation.top",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions."pymdownx.blocks.html"]
[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.emoji"]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.snippets"]
[project.markdown_extensions."pymdownx.superfences"]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown_extensions.sane_lists]

[project.markdown_extensions.toc]
toc_depth = 3

[project.extra]
generator = false

[project.extra.analytics]
provider = "custom"
umami_script_src = "https://metrics.cloudera-labs.com/script.js"
umami_website_id = "ec9cdd83-3798-4fd0-8c07-acb4efd971de"

[project.plugins.search]
[project.plugins.glightbox]
