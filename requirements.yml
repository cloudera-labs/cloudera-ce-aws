collections:
  # Cloudera collections (git-sourced, track main branch)
  - name: https://github.com/cloudera-labs/cloudera.cluster
    type: git
    version: main
  - name: https://github.com/cloudera-labs/cloudera.cloud
    type: git
    version: main
  - name: https://github.com/cloudera-labs/cloudera.exe
    type: git
    version: main


  # Terraform provider
  - name: cloud.terraform
    version: 4.0.0

  # AWS
  - name: amazon.aws
    version: 9.5.1

  # Services
  - name: community.postgresql
    version: 3.7.0
  - name: freeipa.ansible_freeipa
    version: 1.15.1

  # General utilities
  - name: ansible.posix
    version: 1.6.1
  - name: ansible.utils
    version: 5.1.2    
  - name: community.crypto
    version: 2.22.1

roles:
  - name: geerlingguy.postgresql
    version: 3.5.2
